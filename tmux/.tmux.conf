# Rebind prefix key
unbind C-b                  # Remove default binding
set-option -g prefix C-a    # Set Ctrl+A as prefix
bind-key C-a send-prefix    # Double Ctrl+A sends literal Ctrl+A

# Navigate between panes using Vim-style keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes by 10 cells (repeatable)
bind -r H resize-pane -L 10
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 10

# Change colors for status line
#set -g status-bg blue
#set -g status-fg white

bind R source-file ~/.tmux.conf   # Reload tmux configuration
set -g mouse on                   # Enable mouse support
set -sg escape-time 0             # Eliminate ESC delay
set -g base-index 1               # Start window numbering at 1, not 0
setw -g pane-base-index 1         # Start pane numbering at 1
set -g renumber-windows on        # Renumber windows after closing one

# Open new windows and panes in the current directory
bind c new-window -c "#{pane_current_path}"       # New window in current directory
bind '"' split-window -c "#{pane_current_path}"   # Split vertically in current directory
bind % split-window -h -c "#{pane_current_path}"  # Split horizontally in current directory

# Terminal color support
set -g default-terminal "tmux-256color"          # Advertise tmux capabilities to apps
set -as terminal-features ",xterm-ghostty:RGB"   # Enable True Color in Ghostty

# -----------------------------------------------------------------------------
# Plugin Manager 
# -----------------------------------------------------------------------------

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin "janoamaral/tokyo-night-tmux"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
